<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Fauzan Ridani - Android and Web Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="14" fill="#0d1117"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="14" fill="none" stroke="#21262d"/>

  <!-- kiri: identitas -->
  <text x="70" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#34D399">// hello, world</text>
  <text x="70" y="168" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#e6edf3">Fauzan Ridani</text>
  <text x="70" y="212" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">Android &amp; Web Developer</text>
  <rect x="70" y="236" width="80" height="4" rx="2" fill="#34D399"/>
  <text x="70" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#6e7681">Indonesia  ·  fauzan.is-a.dev</text>

  <!-- kanan: jendela kode -->
  <g>
    <rect x="690" y="52" width="440" height="216" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="714" cy="76" r="5" fill="#30363d"/>
    <circle cx="732" cy="76" r="5" fill="#30363d"/>
    <circle cx="750" cy="76" r="5" fill="#30363d"/>
    <text x="1112" y="81" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6e7681">Fauzan.kt</text>
    <line x1="690" y1="94" x2="1130" y2="94" stroke="#30363d"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#c9d1d9">
      <text x="716" y="128"><tspan fill="#34D399">class</tspan> Fauzan : Developer {</text>
      <text x="740" y="158"><tspan fill="#34D399">val</tspan> focus = listOf(<tspan fill="#8b949e">"Android"</tspan>, <tspan fill="#8b949e">"Web"</tspan>)</text>
      <text x="740" y="188"><tspan fill="#34D399">val</tspan> style = <tspan fill="#8b949e">"simple &amp; useful"</tspan></text>
      <text x="740" y="218"><tspan fill="#34D399">fun</tspan> build() = ship(focus, style)</text>
      <text x="716" y="248">}</text>
    </g>
    <rect x="732" y="234" width="9" height="18" fill="#34D399">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
